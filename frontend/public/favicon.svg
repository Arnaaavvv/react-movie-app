<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="clapperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#990012"/>
    </linearGradient>
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3139"/>
      <stop offset="100%" stop-color="#181A20"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F5"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="topStickClip">
      <rect x="5" y="9" width="38" height="7.5" rx="2"/>
    </clipPath>
    <clipPath id="bottomStickClip">
      <rect x="5" y="17" width="38" height="6.5" rx="1.5"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <!-- Movie Board Body -->
    <rect x="5" y="21" width="38" height="22" rx="3.5" fill="url(#clapperGrad)"/>

    <!-- Bottom Stick / Fixed strip -->
    <g clip-path="url(#bottomStickClip)">
      <rect x="5" y="17" width="38" height="6.5" fill="url(#stickGrad)"/>
      <path d="M 11 15 L 16 15 L 11 25 L 6 25 Z" fill="#FFFFFF"/>
      <path d="M 20 15 L 25 15 L 20 25 L 15 25 Z" fill="#FFFFFF"/>
      <path d="M 29 15 L 34 15 L 29 25 L 24 25 Z" fill="#FFFFFF"/>
      <path d="M 38 15 L 43 15 L 38 25 L 33 25 Z" fill="#FFFFFF"/>
    </g>

    <!-- Top Clapper Stick (open angle) -->
    <g transform="rotate(-13, 6, 18.5)">
      <g clip-path="url(#topStickClip)">
        <rect x="5" y="9" width="38" height="7.5" rx="2" fill="url(#stickGrad)"/>
        <path d="M 12 7 L 17 7 L 12 18 L 7 18 Z" fill="#FFFFFF"/>
        <path d="M 21 7 L 26 7 L 21 18 L 16 18 Z" fill="#FFFFFF"/>
        <path d="M 30 7 L 35 7 L 30 18 L 25 18 Z" fill="#FFFFFF"/>
        <path d="M 39 7 L 44 7 L 39 18 L 34 18 Z" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Play Button Triangle inside Clapperboard -->
    <path d="M 21 26.5 C 21 25.7 21.9 25.2 22.6 25.6 L 31.8 30.9 C 32.5 31.3 32.5 32.3 31.8 32.7 L 22.6 38 C 21.9 38.4 21 37.9 21 37.1 Z" fill="url(#playGrad)"/>

    <!-- Hinge Pin / Rivet -->
    <circle cx="8" cy="18.5" r="2" fill="#E2E8F0"/>
    <circle cx="8" cy="18.5" r="1" fill="#475569"/>
  </g>
</svg>